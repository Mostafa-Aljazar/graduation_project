videoAspectRatio = "16:9"
kind = "video"
previewPath = "/al-aqsa-camp-showcase/"
title = "AL-AQSA Camp Showcase"
description = "A short Arabic-first animated motion-graphics showcase presenting AL-AQSA Camp's humanitarian mission, public outreach, impact, and core camp-management capabilities for demos and stakeholder sharing."
version = "1.0.0"
id = "artifacts/al-aqsa-camp-showcase"
router = "path"

[[services]]
name = "web"
paths = [ "/al-aqsa-camp-showcase/" ]
localPort = 18895

[services.development]
run = "pnpm --filter @workspace/al-aqsa-camp-showcase run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/al-aqsa-camp-showcase", "run", "build" ]
serve = "static"
publicDir = "artifacts/al-aqsa-camp-showcase/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18895"
BASE_PATH = "/al-aqsa-camp-showcase/"
