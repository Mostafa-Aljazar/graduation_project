kind = "mobile"
previewPath = "/mobile/"
title = "AL-AQSA Camp Mobile"
description = "A native Arabic RTL companion for AL-AQSA Camp staff and volunteers, adapting public updates, authentication, aid management, people records, security tasks, complaints, and reports for phones with local mock data."
version = "1.0.0"
id = "artifacts/al-aqsa-camp-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24112

[services.development]
run = "pnpm --filter @workspace/al-aqsa-camp-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/al-aqsa-camp-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/al-aqsa-camp-mobile", "run", "serve" ]

[services.env]
PORT = "24112"
BASE_PATH = "/mobile/"
